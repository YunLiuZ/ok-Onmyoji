name: Deploy MkDocs

on:
  push:
    branches:
      - master
    paths:
      - "README.md"
      - "mkdocs.yml"
      - "docs/**"
      - "icons/**"
      - ".github/workflows/docs.yml"

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install MkDocs
        run: pip install mkdocs-material

      - name: Prepare README
        run: |
          cp README.md docs/index.md
          sed -i 's#docs/images/#images/#g' docs/index.md

          mkdir -p docs/icons
          cp icons/icon.png docs/icons/icon.png

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build MkDocs
        run: mkdocs build --clean --site-dir site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4