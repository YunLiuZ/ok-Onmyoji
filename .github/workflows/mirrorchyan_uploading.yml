name: mirrorchyan_release

on:
  workflow_dispatch:
    inputs:
        tag:
            default: ''
            required: false

jobs:
  mirrorchyan:
    runs-on: macos-latest
    if: ${{ github.repository_owner == 'YunLiuZ' }}

    steps:
      - uses: MirrorChyan/uploading-action@v1
        with:
          filetype: latest-release
          filename: "ok-Onmyoji-win32-China-setup.exe"
          mirrorchyan_rid: ok-Onmyoji
          tag: ${{ inputs.tag }}

          os: win
          arch: x86_64

          owner: YunLiuZ
          repo: ok-Onmyoji
          github_token: ${{ secrets.GITHUB_TOKEN }}
          upload_token: ${{ secrets.MirrorChyanUploadToken }}
