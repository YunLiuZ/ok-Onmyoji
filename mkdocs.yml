site_name: ok-Onmyoji
site_description: Documentation for the ok-Onmyoji Onmyoji automation tool
site_url: https://yunliuz.github.io/ok-Onmyoji/

repo_url: https://github.com/YunLiuZ/ok-Onmyoji
repo_name: YunLiuZ/ok-Onmyoji

theme:
  name: material

  icon:
    repo: fontawesome/brands/github

  features:
    - navigation.footer
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest

  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

nav:
  - Home: index.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences

plugins:
  - search

strict: false